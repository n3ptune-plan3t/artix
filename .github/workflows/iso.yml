name: Download ISO

on:
  workflow_dispatch: # Allows manual triggering of the workflow
  push: # Runs when code is pushed to the main branch
    branches:
      - main

jobs:
  download-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ISO
        run: |
          curl -L -o uxp.tar.gz "$ISO_DOWNLOAD_LINK"
        env:
          ISO_DOWNLOAD_LINK: "https://repo.palemoon.org/MoonchildProductions/UXP/archive/e59e88bfd59f37fabc15b30ec304f90a410c751f.tar.gz"
          
      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: uxp.tar.gz
          path: uxp.tar.gz
          retention-days: 5 # Artifact retention period (adjust as needed)
