name: Download ISO

on:
  workflow_dispatch: # Allows manual triggering of the workflow
  push: # Runs when code is pushed to the main branch
    branches:
      - main

jobs:
  download-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ISO
        run: |
          curl -L -o obarun-JWM-2025.06.13-86-64.iso "$ISO_DOWNLOAD_LINK"
        env:
          ISO_DOWNLOAD_LINK: "https://cloud.server.obarun.org/iso/2025.06.13/obarun-JWM-2025.06.13-x86_64.iso"
          
      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: obarun-JWM-2025.06.13-86-64.iso
          path: obarun-JWM-2025.06.13-86-64.iso
          retention-days: 5 # Artifact retention period (adjust as needed)
