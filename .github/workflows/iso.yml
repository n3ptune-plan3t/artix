name: Download and Release Archive

on:
  workflow_dispatch: # Allows manual triggering of the workflow
  push: # Runs when code is pushed to the main branch
    branches:
      - main

jobs:
  release-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases and tags
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Archive
        run: |
          curl -L -o UXP-e59e88bfd59f37fabc15b30ec304f90a410c751f.zip "$ARCHIVE_DOWNLOAD_LINK"
        env:
          ARCHIVE_DOWNLOAD_LINK: "https://repo.palemoon.org/MoonchildProductions/UXP/archive/e59e88bfd59f37fabc15b30ec304f90a410c751f.zip"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-${{ github.sha }}
          name: UXP Source Release (${{ github.run_number }})
          body: "Automated release of UXP source archive from Pale Moon repository."
          files: UXP-e59e88bfd59f37fabc15b30ec304f90a410c751f.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
