name: Download and Release Archive

on:
  workflow_dispatch: # Allows manual triggering of the workflow
  push: # Runs when code is pushed to the main branch
    branches:
      - main

jobs:
  release-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases and tags
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Archive
        run: |
          # Extract the filename dynamically from the URL
          FILENAME=$(basename "$ARCHIVE_DOWNLOAD_LINK")
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          
          curl -L -o "$FILENAME" "$ARCHIVE_DOWNLOAD_LINK"
        env:
          ARCHIVE_DOWNLOAD_LINK: "https://repo.palemoon.org/MoonchildProductions/UXP/archive/master.tar.gz"

      - name: Generate SHA-1 Checksum
        run: |
          echo "Generating SHA-1 checksum for ${{ env.FILENAME }}..."
          sha1sum "${{ env.FILENAME }}"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-${{ github.sha }}
          name: Basilisk Source Release (${{ github.run_number }})
          body: "Automated release of Basilisk source archive from upstream repository."
          files: ${{ env.FILENAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
